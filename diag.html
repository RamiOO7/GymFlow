<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico GymFlow</title>
<style>body{font:16px system-ui;background:#0b0d12;color:#eee;padding:16px;max-width:560px;margin:auto}p{margin:8px 0;padding:10px;border-radius:10px;background:#151922}.ok{border-left:4px solid #22d3a6}.no{border-left:4px solid #ff5c6c}</style></head><body>
<h2>Diagnóstico GymFlow</h2><div id="o"></div>
<script>
const o=document.getElementById("o");
const add=(ok,t)=>{o.insertAdjacentHTML("beforeend",`<p class="${ok?"ok":"no"}">${ok?"✅":"❌"} ${t}</p>`)};
(async()=>{
 add(location.protocol=="https:","Conexión segura (https): "+location.protocol);
 add(!!document.querySelector('link[rel=manifest]'),"index.html no se comprueba aquí; abre / y mira el siguiente punto");
 let m;
 try{const r=await fetch("manifest.webmanifest",{cache:"no-store"});add(r.ok,"manifest.webmanifest → HTTP "+r.status);if(r.ok){m=await r.json();
  add(!!m.name,"name: "+m.name);add(!!m.start_url,"start_url: "+m.start_url);add(m.display=="standalone","display: "+m.display);
  for(const i of m.icons||[]){try{const x=await fetch(i.src,{cache:"no-store"});const b=await x.blob();const u=URL.createObjectURL(b);const im=new Image();await new Promise((a,e)=>{im.onload=a;im.onerror=e;im.src=u});add(x.ok,`icono ${i.src} (${i.purpose}) → ${im.naturalWidth}x${im.naturalHeight}`)}catch(e){add(false,"icono "+i.src+" NO se puede cargar")}}}}
 catch(e){add(false,"manifest.webmanifest no se puede leer")}
 try{const r=await fetch("sw.js",{cache:"no-store"});add(r.ok,"sw.js → HTTP "+r.status)}catch(e){add(false,"sw.js no se puede leer")}
 try{const r=await fetch("./",{cache:"no-store"});const t=await r.text();add(/rel="manifest"/.test(t),"index.html enlaza el manifest")}catch(e){add(false,"index.html no se puede leer")}
 add("serviceWorker" in navigator,"Service worker soportado");
})();
</script></body></html>
