<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GymFlow</title>
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GymFlow">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#232938;--tx:#eef1f7;--mut:#8b93a7;--ac:#7c5cff;--ac2:#22d3a6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#0b0d12}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:560px;margin:auto;padding:16px 16px 96px}
h1{font-size:26px;margin:4px 0 2px;letter-spacing:-.5px}h1 span{color:var(--ac)}
.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.chip{flex:none;padding:9px 16px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-weight:600;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ex img{width:100%;max-height:190px;object-fit:contain;background:#fff;border-radius:12px;margin-bottom:10px}.ex h3{margin:0 0 10px;font-size:16px}
.set{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center;margin-bottom:8px}
.set b{color:var(--mut);font-size:13px;text-align:center}
input{width:100%;background:#0f121a;border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:10px;font-size:16px;text-align:center}
.ok{height:40px;border-radius:10px;border:1px solid var(--line);background:#0f121a;color:var(--mut);font-size:18px;cursor:pointer}
.ok.on{background:var(--ac2);border-color:var(--ac2);color:#06231c}
.btn{width:100%;padding:14px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
.ghost{background:transparent;border:1px dashed var(--line);color:var(--mut);padding:10px;border-radius:10px;width:100%;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:22px;color:var(--ac2)}.stat span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:8px;height:140px}
.bar{flex:1;background:linear-gradient(var(--ac),#5b3fe0);border-radius:8px 8px 0 0;min-height:4px;position:relative}
.bar i{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:10px;color:var(--mut);font-style:normal}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(11,13,18,.9);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav div{display:flex;width:100%;max-width:560px}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:6px;cursor:pointer}
nav button.on{color:var(--ac)}nav button span{display:block;font-size:20px}
.h{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.h:last-child{border:0}.h em{color:var(--mut);font-style:normal}
.hide{display:none}
</style></head><body>
<h1>Gym<span>Flow</span></h1>
<div class="sub" id="date"></div>

<section id="hoy">
  <div class="chips" id="chips"></div>
  <div class="sub" style="margin:0 0 10px">4 series · 10-12 reps · 1 min de descanso</div>
  <div id="ex"></div>
  <div class="row" style="margin-bottom:12px"><input id="nx" placeholder="Añadir otro ejercicio…"><button class="btn" style="width:auto;padding:10px 18px" onclick="addEx()">+</button></div>
  <button class="btn" onclick="finish()">Terminar entreno</button>
</section>

<section id="prog" class="hide">
  <div class="stats" id="stats"></div>
  <div class="card"><div style="font-weight:700;margin-bottom:22px">Volumen por entreno (kg)</div><div class="bars" id="bars"></div><div style="height:20px"></div></div>
</section>

<section id="hist" class="hide"><div class="card" id="list"></div></section>

<nav><div>
<button class="on" onclick="tab('hoy',this)"><span>🏋️</span>Hoy</button>
<button onclick="tab('prog',this)"><span>📈</span>Progreso</button>
<button onclick="tab('hist',this)"><span>🗓️</span>Historial</button>
</div></nav>

const R={Empuje:[["Flexiones con rodillas","fl"],["Press pecho máquina","pp"],["Press francés","pf"],["Aperturas","ap"],["Fondos máquina","fo"],["Press de hombro máquina","ph"],["Extensión de tríceps cuerda","et"],["Plank 30 s","pk"],["Plank lateral 30 s","pl"]],
"Tirón":[["Jalón","ja"],["Remo unilateral","ru"],["Remo cerrado","rc"],["Bíceps alterno","ba"],["Bíceps agarre V","bv"],["Aperturas máquina","am"],["Plank 45 s","p45"],["Elevación de piernas 45 s","el"],["Criss-cross 45 s","cr"]],
Pierna:[["Prensa","pr"],["Extensión de cuádriceps","ec"],["Curl de piernas máquina","cp"],["Abductores y aductores","ab"],["Gemelo en máquina","gm"]]};
let cur="Empuje",wk=[],hist=[],extra={};
try{hist=JSON.parse(localStorage.getItem("gf_h")||"[]")}catch(e){}
try{extra=JSON.parse(localStorage.getItem("gf_x")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
$("date").textContent=new Date().toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
const list=()=>R[cur].concat((extra[cur]||[]).map(n=>[n,null]));
const newSets=()=>[0,1,2,3].map(()=>({w:"",r:"",d:0}));
function init(){wk=list().map(newSets);draw()}
function draw(){
 $("chips").innerHTML=Object.keys(R).map(k=>`<div class="chip ${k==cur?"on":""}" onclick="cur='${k}';init()">${k}</div>`).join("");
 $("ex").innerHTML=list().map(([n,k],i)=>`<div class="card ex">${k?`<img src="${IMG[k]}" alt="${n}">`:""}<h3>${i+1}. ${n}</h3>`+wk[i].map((s,j)=>`<div class="set"><b>${j+1}</b><input type="number" inputmode="decimal" placeholder="kg" value="${s.w}" oninput="wk[${i}][${j}].w=this.value"><input type="number" inputmode="numeric" placeholder="reps" value="${s.r}" oninput="wk[${i}][${j}].r=this.value"><button class="ok ${s.d?"on":""}" onclick="wk[${i}][${j}].d^=1;draw()">✓</button></div>`).join("")+`<button class="ghost" onclick="wk[${i}].push({w:'',r:'',d:0});draw()">+ Añadir serie</button></div>`).join("");
}
function addEx(){
 const v=$("nx").value.trim();if(!v)return;
 (extra[cur]=extra[cur]||[]).push(v);$("nx").value="";
 try{localStorage.setItem("gf_x",JSON.stringify(extra))}catch(e){}
 wk.push(newSets());draw()}
function finish(){
 let vol=0,sets=0;
 wk.forEach(a=>a.forEach(s=>{if(s.d&&s.w&&s.r){vol+=s.w*s.r;sets++}}));
 if(!sets){alert("Marca al menos una serie con ✓");return}
 hist.push({t:Date.now(),n:cur,v:Math.round(vol),s:sets});
 try{localStorage.setItem("gf_h",JSON.stringify(hist))}catch(e){}
 init();renderStats();alert("¡Entreno guardado! 💪")}
function renderStats(){
 const tv=hist.reduce((a,h)=>a+h.v,0),best=Math.max(0,...hist.map(h=>h.v));
 $("stats").innerHTML=[[hist.length,"Entrenos"],[(tv/1000).toFixed(1)+"t","Volumen total"],[best,"Mejor (kg)"]].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join("");
 const l=hist.slice(-7),m=Math.max(1,...l.map(h=>h.v));
 $("bars").innerHTML=l.length?l.map(h=>`<div class="bar" style="height:${h.v/m*100}%"><i>${h.n.slice(0,4)}</i></div>`).join(""):'<div style="color:var(--mut);font-size:14px">Aún no hay entrenos</div>';
 $("list").innerHTML=hist.length?[...hist].reverse().map(h=>`<div class="h"><span><b>${h.n}</b> <em>${new Date(h.t).toLocaleDateString("es",{day:"numeric",month:"short"})}</em></span><span>${h.s} series · ${h.v} kg</span></div>`).join(""):'<div style="color:var(--mut)">Sin historial todavía</div>';
}
function tab(id,b){["hoy","prog","hist"].forEach(x=>$(x).classList.toggle("hide",x!=id));document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");renderStats()}
init();renderStats();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
